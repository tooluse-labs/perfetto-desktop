[package]
name = "perfetto-desktop"
version = "0.1.0"
description = "Tauri desktop wrapper for Perfetto"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "perfetto-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
