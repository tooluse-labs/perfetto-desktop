[package]
name = "perfetto-desktop"
version = "0.2.7"
description = "Tauri desktop wrapper for Perfetto"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "perfetto-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytes = "1.11"
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
