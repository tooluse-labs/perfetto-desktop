<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="580" height="130" role="img" aria-label="Perfetto Desktop — Unofficial desktop wrapper for Perfetto.">
  <svg x="12" y="15" width="100" height="100" viewBox="0 0 1024 1024" aria-hidden="true">
    <defs>
      <clipPath id="pdTileClip">
        <rect width="1024" height="1024" rx="224" ry="224"/>
      </clipPath>
      <clipPath id="pdLensClip">
        <circle cx="512" cy="480" r="274"/>
      </clipPath>
      <linearGradient id="pdBg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0B1020"/>
        <stop offset="1" stop-color="#0B1020"/>
      </linearGradient>
      <radialGradient id="pdWarmDepth" cx="820" cy="820" r="430" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#F59E0B" stop-opacity="0.11"/>
        <stop offset="0.46" stop-color="#F59E0B" stop-opacity="0.04"/>
        <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="pdHotTrace" x1="196" y1="490" x2="828" y2="490" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FF765C"/>
        <stop offset="0.48" stop-color="#FFA14A"/>
        <stop offset="1" stop-color="#FFD86F"/>
      </linearGradient>
      <linearGradient id="pdLensStroke" x1="318" y1="250" x2="782" y2="714" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#B9F5FF"/>
        <stop offset="0.42" stop-color="#4CC9F0"/>
        <stop offset="1" stop-color="#2DD4BF"/>
      </linearGradient>
      <radialGradient id="pdLensGlass" cx="368" cy="292" r="430" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#E5FAFF" stop-opacity="0.2"/>
        <stop offset="0.48" stop-color="#4CC9F0" stop-opacity="0.07"/>
        <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="pdEvent" x1="784" y1="742" x2="870" y2="828" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFD86F"/>
        <stop offset="1" stop-color="#FFB000"/>
      </linearGradient>
      <filter id="pdShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
      </filter>
      <filter id="pdTraceGlow" x="-25%" y="-80%" width="150%" height="260%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#FFA14A" flood-opacity="0.36"/>
      </filter>
    </defs>

    <g clip-path="url(#pdTileClip)">
      <rect width="1024" height="1024" fill="url(#pdBg)"/>
      <rect width="1024" height="1024" fill="url(#pdWarmDepth)"/>
      <g filter="url(#pdShadow)">
        <circle cx="512" cy="480" r="320" fill="#0B1020" opacity="0.34"/>
        <circle cx="512" cy="480" r="272" fill="url(#pdLensGlass)"/>
        <g clip-path="url(#pdLensClip)">
          <rect x="244" y="206" width="536" height="548" fill="#0B1020" opacity="0.34"/>
          <path d="M252 480H366L424 568L500 346L580 614L658 480H786" fill="none" stroke="url(#pdHotTrace)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" filter="url(#pdTraceGlow)"/>
        </g>
        <circle cx="512" cy="480" r="304" fill="none" stroke="#06101D" stroke-width="72" opacity="0.72"/>
        <circle cx="512" cy="480" r="304" fill="none" stroke="url(#pdLensStroke)" stroke-width="54"/>
        <path d="M360 314C400 272 458 248 522 248" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.42"/>
        <circle cx="512" cy="480" r="244" fill="none" stroke="#E5FAFF" stroke-width="4" opacity="0.22"/>
        <path d="M726 730L812 816" fill="none" stroke="#06101D" stroke-width="80" stroke-linecap="round" opacity="0.72"/>
        <path d="M726 730L812 816" fill="none" stroke="url(#pdLensStroke)" stroke-width="62" stroke-linecap="round"/>
      </g>
      <circle cx="824" cy="828" r="31" fill="url(#pdEvent)" filter="url(#pdShadow)"/>
      <circle cx="813" cy="817" r="8" fill="#FFF4B8" opacity="0.95"/>
      <rect x="12" y="12" width="1000" height="1000" rx="212" ry="212" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.14"/>
      <rect x="30" y="30" width="964" height="964" rx="194" ry="194" fill="none" stroke="#0B1020" stroke-width="18" opacity="0.48"/>
    </g>
  </svg>
  <text x="128" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="42" fill="#F1F5F9">Perfetto Desktop</text>
  <text x="128" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#CBD5E1">Unofficial desktop wrapper for Perfetto.</text>
</svg>
