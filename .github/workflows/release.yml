name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Cache Perfetto checkout
        uses: actions/cache@v4
        with:
          path: third_party/perfetto
          key: perfetto-checkout-${{ hashFiles('DEPS') }}

      - name: Cache Perfetto UI build deps
        uses: actions/cache@v4
        with:
          path: |
            third_party/perfetto/buildtools
            third_party/perfetto/.venv
            third_party/perfetto/third_party/pnpm
            third_party/perfetto/ui/node_modules
          key: perfetto-builddeps-${{ hashFiles('DEPS') }}

      - name: Fetch Perfetto + UI build deps
        run: ./scripts/setup.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: pnpm install
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: pnpm tauri build
        working-directory: desktop
        run: pnpm tauri build

      - name: List build artifacts
        run: |
          echo "--- DMG ---"
          ls -lh desktop/src-tauri/target/release/bundle/dmg/ || true
          echo "--- .app ---"
          ls -lh desktop/src-tauri/target/release/bundle/macos/ || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfetto-desktop-macos-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Resolve release notes file (if present)
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$file" ]]; then
            echo "==> Using handwritten release notes: $file"
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "==> No handwritten release notes for $GITHUB_REF_NAME; falling back to auto-generated."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
